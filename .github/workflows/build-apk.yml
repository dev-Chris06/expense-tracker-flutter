name: Build Android APK

# Même principe que Loady : l'APK est signé avec la clé debug partagée
# (secret DEBUG_KEYSTORE_BASE64), pour que chaque nouvelle version
# s'installe par-dessus la précédente sur le téléphone sans désinstaller.
# Un tag v* publie les APK dans les GitHub Releases.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Restore debug keystore (same cert as user's phone)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is missing — APK would be signed with a random cert that cannot upgrade installed versions."
            exit 1
          fi
          # Lu par android/app/build.gradle.kts (signingConfig "shared").
          KEYSTORE=android/app/shared-debug.keystore
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d -i > "$KEYSTORE"
          SIZE=$(stat -c%s "$KEYSTORE")
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore is suspiciously small (${SIZE} bytes)."
            exit 1
          fi
          FINGERPRINT=$(keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            | grep -E "SHA-?256" | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Keystore SHA-256: ${FINGERPRINT}"
          echo "KEYSTORE_SHA256=${FINGERPRINT}" >> "$GITHUB_ENV"

      # Un tag doit correspondre à la version de pubspec.yaml.
      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          NAME=${VERSION%%+*}
          if [ "${GITHUB_REF_NAME}" != "v${NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${VERSION} (expected v${NAME})."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite (for tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Run tests before building
        run: flutter test --no-pub

      # arm64 pour les téléphones récents, armeabi-v7a pour les 32 bits.
      - name: Build release APKs (arm64 + armeabi-v7a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Rename artifacts with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$OUT/app-arm64-v8a-release.apk" "dist/depenses-flutter-${VERSION}-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/depenses-flutter-${VERSION}-armv7.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Verify APK signature matches the restored keystore
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          # Échoue si un APK n'est pas signé avec la clé partagée : il ne
          # pourrait pas mettre à jour la version installée sur le téléphone.
          for apk in dist/*.apk; do
            DIGEST=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 "certificate SHA-256 digest" | sed 's/.*: //')
            echo "$apk → ${DIGEST}"
            if [ "$DIGEST" != "$KEYSTORE_SHA256" ]; then
              echo "::error::$apk is signed with ${DIGEST}, expected ${KEYSTORE_SHA256}."
              exit 1
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: depenses-flutter-apk-${{ steps.rename.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: false
          make_latest: true
          generate_release_notes: true
